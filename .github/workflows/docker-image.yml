name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build web, online API, and manual backup images
        run: docker compose --profile ops build

      - name: Smoke test local-only proxy, private state snapshot, and backup
        run: |
          set -euo pipefail
          trap 'docker compose --profile ops down --remove-orphans' EXIT
          docker compose --profile ops up --no-build -d online monopoly
          healthy=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3002/api/health > /dev/null; then
              healthy=1
              break
            fi
            sleep 1
          done
          test "$healthy" -eq 1
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"name":"Alice"}' \
            http://127.0.0.1:3002/api/rooms > /dev/null
          docker compose --profile ops run --rm --no-deps backup
          docker compose --profile ops run --rm --no-deps \
            --entrypoint sh backup -c \
            'test "$(find /app/backups -maxdepth 1 -type f -name "rooms-*.json" | wc -l)" -ge 1'

      - name: Check rate limit returns HTTP 429 under repeated traffic
        run: |
          set -euo pipefail
          trap 'docker compose --profile ops down --remove-orphans' EXIT
          docker compose --profile ops up --no-build -d online monopoly
          count=0
          for attempt in $(seq 1 60); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:3002/api/health)
            if [ "$status" = "429" ]; then count=$((count + 1)); fi
          done
          echo "Throttled requests: $count"
          test "$count" -gt 0
