name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag russian-monopoly-web:test
    - name: Build the Online API image
      run: docker build . --file Dockerfile.online --tag russian-monopoly-online:test
