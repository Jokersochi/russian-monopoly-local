name: One-time dependency security fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-production-dependencies:
    if: github.head_ref == 'agent/premium-responsive-ui'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply non-breaking npm audit fixes
        shell: bash
        run: |
          npm audit fix --omit=dev || true
          npm audit --omit=dev --audit-level=high

      - name: Commit dependency fixes
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: apply non-breaking production dependency security updates"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
