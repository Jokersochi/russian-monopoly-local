name: Sync npm lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.head_ref == 'agent/premium-responsive-ui'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized package lock
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize npm lockfile"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
