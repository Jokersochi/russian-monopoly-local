name: One-time branch maintenance

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  maintain:
    if: github.head_ref == 'agent/premium-responsive-ui'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply safe ESLint autofix to game context
        run: npx eslint src/contexts/GameContext.tsx --fix

      - name: Commit maintenance changes
        shell: bash
        run: |
          if git diff --quiet -- src/contexts/GameContext.tsx; then
            echo "No maintenance changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/contexts/GameContext.tsx
          git commit -m "fix: apply safe game context lint autofix"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
