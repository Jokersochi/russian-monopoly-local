services:
  online:
    build:
      context: .
      dockerfile: Dockerfile.online
    expose:
      - "3001"
    environment:
      - ONLINE_HOST=0.0.0.0
      - ONLINE_PORT=3001
      - ONLINE_DATA_FILE=/app/data/rooms.json
    volumes:
      - online-data:/app/data
    restart: unless-stopped

  # Manually invoked only; no unsupervised restores or retention deletions.
  backup:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: Dockerfile.online
    entrypoint: ["node", "scripts/online-state-backup.mjs"]
    environment:
      - ONLINE_DATA_FILE=/app/data/rooms.json
      - ONLINE_BACKUP_DIR=/app/backups
    volumes:
      - online-data:/app/data:ro
      - online-backups:/app/backups
    network_mode: "none"
    restart: "no"

  # Destructive recovery is always manual and requires explicit --apply --confirm-offline.
  # The operator must STOP online before applying and review the dry-run report.
  restore:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: Dockerfile.online
    entrypoint: ["node", "scripts/online-state-restore.mjs"]
    environment:
      - ONLINE_DATA_FILE=/app/data/rooms.json
      - ONLINE_BACKUP_DIR=/app/backups
    volumes:
      - online-data:/app/data
      - online-backups:/app/backups
    network_mode: "none"
    restart: "no"

  monopoly:
    build: .
    depends_on:
      - online
    ports:
      - "127.0.0.1:3002:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

volumes:
  online-data:
  online-backups:
