# Zones live in the nginx http context (this file is included from conf.d).
# Never trust forwarded IP headers without an explicitly configured trusted proxy.
limit_req_zone $binary_remote_addr zone=online_api_rate:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=online_api_connections:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    location /api/ {
        # Bound anonymous room creation and authenticated API traffic per client IP.
        limit_req zone=online_api_rate burst=20 nodelay;
        limit_req_status 429;
        # SSE connections are long-lived; leave room for multiple players per IP.
        limit_conn online_api_connections 25;
        limit_conn_status 429;
        client_max_body_size 8k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $online_upstream online:3001;
        proxy_pass http://$online_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}